name: auto-update

# 공휴일을 자동으로 주워 온다.
#
# 임시공휴일·선거일은 보통 2주 전에는 발표되므로 하루 1회면 넉넉하다.
# 출처(구글 캘린더 '대한민국의 휴일' ICS)는 API 키가 필요 없다.
# **추가만 하고 삭제하지 않는다** — 출처가 미래 연도의 대체공휴일·선거일을
# 빠뜨리는 것이 확인돼, 없다는 이유로 지우면 멀쩡한 휴일이 사라진다.
on:
  schedule:
    - cron: "17 21 * * *"   # 매일 UTC 21:17 = KST 06:17
  workflow_dispatch:         # 손으로 즉시 돌리고 싶을 때

permissions:
  contents: write            # 자동 커밋용

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 공휴일 수집·병합
        id: run
        run: |
          python3 update_holidays.py | tee /tmp/out.txt
          if git diff --quiet -- holidays.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 형식 검사 (바뀐 경우만)
        if: steps.run.outputs.changed == 'true'
        run: |
          git show HEAD:holidays.json > /tmp/prev.json
          python3 validate.py holidays.json --prev-file /tmp/prev.json

      - name: 커밋
        if: steps.run.outputs.changed == 'true'
        run: |
          added=$(grep -c '^  + ' /tmp/out.txt) || added=0
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add holidays.json
          git commit -F - <<MSG
          chore: 공휴일 자동 갱신 — ${added}일 추가

          $(grep '^  + ' /tmp/out.txt)

          출처: 구글 캘린더 '대한민국의 휴일' ICS (키 불필요).
          추가만 하고 삭제하지 않는다 — 출처가 미래 대체공휴일·선거일을 빠뜨린다.
          MSG
          git push
      # ★GitHub는 공개 저장소에 60일간 커밋이 없으면 schedule 워크플로를 자동 비활성화한다
      #   (워크플로가 매일 돌아도 '활동'으로 안 친다). 공휴일은 몇 달씩 변화가 없을 수 있어
      #   그대로 두면 어느 날 조용히 멈춘다. 마지막 커밋이 45일을 넘으면 표시 파일만 갱신해
      #   커밋한다 — holidays.json 은 건드리지 않으므로 앱엔 아무 영향이 없다.
      - name: 60일 무활동 자동 비활성화 방지
        if: steps.run.outputs.changed == 'false'
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          days=$(( (now - last) / 86400 ))
          echo "마지막 커밋으로부터 ${days}일"
          if [ "$days" -lt 45 ]; then exit 0; fi
          date -u +%F > .github/last-run
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-run
          git commit -m "chore: 스케줄 유지용 커밋 (${days}일 무변경 — 공휴일 데이터 변경 없음)"
          git push
