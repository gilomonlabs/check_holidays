name: validate

# 앱은 형식이 깨진 holidays.json 을 조용히 무시한다 — 그러면 아무도 모르는 채로
# 업데이트가 멈춘다. 그 침묵을 push 시점에 깬다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2   # 이전 커밋의 version 과 비교하기 위해

      - name: 이전 버전 꺼내 두기
        run: |
          # validate.py 가 dates/removed 만 비교하므로, note 만 고친 변경은 통과한다.
          git show HEAD~1:holidays.json > /tmp/prev.json 2>/dev/null || true

      - name: holidays.json 검사
        run: |
          if [ -f /tmp/prev.json ]; then
            python3 validate.py holidays.json --prev-file /tmp/prev.json
          else
            python3 validate.py holidays.json
          fi
